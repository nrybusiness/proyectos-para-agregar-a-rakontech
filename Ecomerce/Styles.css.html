<style>
/* ═══════════════════════════════════════════════════════════════════
   THE GUMMY BOX · MARCO E-COMMERCE
   Paleta: Rojo Premium · Dark Mode · Mobile-First
   Rakon Technology v2.1.0
═══════════════════════════════════════════════════════════════════ */
:root {
  --c-bg:           #0d0505;
  --c-surface:      #160a0a;
  --c-surface2:     #1f0e0e;
  --c-border:       rgba(220,50,50,0.12);
  --c-border-h:     rgba(220,50,50,0.35);
  --c-accent:       #E8272A;
  --c-accent-light: #FF4C4F;
  --c-accent-dim:   rgba(232,39,42,0.12);
  --c-accent-glow:  rgba(232,39,42,0.30);
  --c-gold:         #F5C842;
  --c-text:         #F5EDED;
  --c-text-muted:   #9A7070;
  --c-text-dim:     #5A3535;
  --c-white:        #ffffff;
  --r-sm:    12px; --r-md: 18px; --r-lg: 24px;
  --r-xl:    32px; --r-pill: 999px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.7), 0 8px 32px rgba(232,39,42,.08);
  --transition: 0.25s cubic-bezier(.4,0,.2,1);
  --font: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit}
a{color:inherit;text-decoration:none}

/* ── ORBS ─────────────────────────────────────────────────────── */
.orb-wrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.14;animation:orbFloat 20s ease-in-out infinite alternate}
.orb-1{width:500px;height:500px;background:#c0151a;top:-150px;left:-100px;animation-delay:0s}
.orb-2{width:320px;height:320px;background:#8B0000;bottom:5%;right:-80px;animation-delay:-8s}
.orb-3{width:220px;height:220px;background:#E8272A;top:40%;left:25%;animation-delay:-15s;opacity:.08}
@keyframes orbFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(25px,35px) scale(1.1)}}

/* ── LAYOUT ───────────────────────────────────────────────────── */
#app{position:relative;z-index:1}
.container{max-width:480px;margin:0 auto;padding:0 20px}

/* ── REVEAL ───────────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:.1s}.reveal-d2{transition-delay:.2s}
.reveal-d3{transition-delay:.3s}.reveal-d4{transition-delay:.4s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in-1{animation:fadeUp .6s ease forwards .1s;opacity:0}
.fade-in-2{animation:fadeUp .6s ease forwards .25s;opacity:0}
.fade-in-3{animation:fadeUp .6s ease forwards .4s;opacity:0}
.fade-in-4{animation:fadeUp .6s ease forwards .55s;opacity:0}

/* ── NAV ──────────────────────────────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,5,5,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--c-border);transition:background var(--transition)}
.nav-logo{font-size:15px;font-weight:800;letter-spacing:.1em;color:var(--c-white);line-height:1.1}
.nav-logo span{display:block;font-size:10px;font-weight:500;color:var(--c-accent);letter-spacing:.18em;text-transform:uppercase}
.nav-right{display:flex;gap:10px;align-items:center}
.nav-icon{width:38px;height:38px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:var(--c-surface);border:1px solid var(--c-border);font-size:16px;transition:background var(--transition),border-color var(--transition)}
.nav-icon:hover{background:var(--c-surface2);border-color:var(--c-border-h)}

/* ── HERO ─────────────────────────────────────────────────────── */
.hero{padding:76px 0 0}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.badge-sold{background:var(--c-accent);color:#fff}
.badge-hot{background:rgba(232,39,42,.15);color:var(--c-accent-light);border:1px solid rgba(232,39,42,.3)}

/* ── HERO IMAGEN CAROUSEL ──────────────────────────────────────── */
.hero-img-wrap{position:relative;margin:0 -20px 0;overflow:hidden;background:linear-gradient(160deg,#2a0a0a 0%,#160303 100%)}
.hero-slides{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.hero-slide{min-width:100%;display:flex;align-items:center;justify-content:center;padding:20px 30px;min-height:340px}
.hero-slide img{width:100%;max-width:340px;border-radius:var(--r-xl);object-fit:contain;filter:drop-shadow(0 20px 60px rgba(232,39,42,.35))}
.hero-dots{display:flex;justify-content:center;gap:8px;padding:16px 0 20px;background:linear-gradient(160deg,#2a0a0a 0%,#160303 100%)}
.hero-dot{width:8px;height:8px;border-radius:50%;background:var(--c-text-dim);transition:background var(--transition),transform var(--transition);cursor:pointer}
.hero-dot.active{background:var(--c-accent);transform:scale(1.25)}
.hero-img-discount{position:absolute;top:16px;right:20px;background:var(--c-accent);color:#fff;padding:6px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:800;box-shadow:0 4px 16px var(--c-accent-glow)}

/* ── META ─────────────────────────────────────────────────────── */
.hero-rating{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-top:20px}
.stars{color:var(--c-gold);font-size:14px;letter-spacing:1px}
.rating-text{font-size:13px;color:var(--c-text-muted)}
.hero h1{font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.02em;margin-bottom:6px}
.hero-brand{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);margin-bottom:10px}
.hero-desc{font-size:14px;color:var(--c-text-muted);line-height:1.65;margin-bottom:18px}
.hero-price{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.price-now{font-size:32px;font-weight:800;color:var(--c-accent)}
.price-full{font-size:17px;color:var(--c-text-dim);text-decoration:line-through}
.price-save{font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:rgba(232,39,42,.15);color:var(--c-accent-light);border:1px solid rgba(232,39,42,.25)}

/* ── INGREDIENTES CHIPS ────────────────────────────────────────── */
.ingredients{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.ingr-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--c-border);background:var(--c-surface);font-size:12px;font-weight:600;color:var(--c-text-muted)}
.ingr-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);flex-shrink:0}

/* ── BENEFITS ─────────────────────────────────────────────────── */
.benefits{margin:14px 0;display:flex;flex-direction:column;gap:8px}
.benefit-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--c-text-muted)}
.benefit-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;background:var(--c-accent-dim);border:1px solid var(--c-accent);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--c-accent)}

/* ── SECTION ─────────────────────────────────────────────────── */
.section-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);margin-bottom:10px}
.section{padding:26px 0;border-top:1px solid var(--c-border)}

/* ── VARIANTS ─────────────────────────────────────────────────── */
.variants{display:flex;flex-direction:column;gap:10px}
.variant-card{position:relative;padding:14px 16px;border-radius:var(--r-md);border:1.5px solid var(--c-border);background:var(--c-surface);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color var(--transition),background var(--transition),transform var(--transition)}
.variant-card:hover{border-color:var(--c-border-h);transform:translateY(-1px)}
.variant-card.active{border-color:var(--c-accent);background:var(--c-accent-dim)}
.variant-card.active .variant-name{color:var(--c-accent-light)}
.variant-left{display:flex;flex-direction:column;gap:2px}
.variant-name{font-size:15px;font-weight:600}
.variant-unit{font-size:12px;color:var(--c-text-muted)}
.variant-price{font-size:18px;font-weight:800}
.variant-badge-wrap{position:absolute;top:-10px;left:14px;background:var(--c-accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 9px;border-radius:var(--r-pill);text-transform:uppercase}

/* ── SHIPPING ─────────────────────────────────────────────────── */
.shipping-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ship-card{padding:14px 14px 16px;border-radius:var(--r-md);border:1.5px solid var(--c-border);background:var(--c-surface);cursor:pointer;transition:border-color var(--transition),background var(--transition);position:relative}
.ship-card:hover{border-color:var(--c-border-h)}
.ship-card.active{border-color:var(--c-accent);background:var(--c-accent-dim)}
.ship-type{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-muted);margin-bottom:4px}
.ship-price-main{font-size:20px;font-weight:800;line-height:1;margin-bottom:2px}
.ship-price-sub{font-size:11px;color:var(--c-text-muted);margin-bottom:8px}
.ship-perks{display:flex;flex-direction:column;gap:3px}
.ship-perk{font-size:11px;color:var(--c-text-muted);display:flex;align-items:center;gap:5px}
.ship-perk::before{content:"✓";color:var(--c-accent);font-weight:700;font-size:10px}
.ship-popular{position:absolute;top:-10px;right:14px;background:var(--c-accent);color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r-pill);text-transform:uppercase}

/* ── URGENCY ──────────────────────────────────────────────────── */
.urgency-wrap{background:rgba(232,39,42,.07);border:1px solid rgba(232,39,42,.2);border-radius:var(--r-md);padding:14px 16px;margin:18px 0}
.urgency-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.urgency-label{font-size:12px;font-weight:700;color:var(--c-accent);display:flex;align-items:center;gap:6px}
.urgency-dot{width:7px;height:7px;border-radius:50%;background:var(--c-accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.urgency-count{font-size:12px;color:var(--c-text-muted)}
.urgency-bar-bg{height:6px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);overflow:hidden}
.urgency-bar-fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,#8B0000,var(--c-accent),#FF6B6B);width:0%;transition:width 1.3s cubic-bezier(.4,0,.2,1)}
.delivery-tag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-text-muted);margin-bottom:18px}
.delivery-tag span{color:var(--c-text);font-weight:600}

/* ── BTNS ─────────────────────────────────────────────────────── */
.btn-cta{width:100%;padding:17px 24px;border-radius:var(--r-lg);font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--c-accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform var(--transition),box-shadow var(--transition);box-shadow:0 0 32px var(--c-accent-glow);position:relative;overflow:hidden}
.btn-cta::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background var(--transition)}
.btn-cta:hover{transform:scale(1.015);box-shadow:0 0 52px var(--c-accent-glow),0 4px 24px rgba(232,39,42,.4)}
.btn-cta:hover::after{background:rgba(255,255,255,.08)}
.btn-cta:active{transform:scale(.98)}
.btn-whatsapp{width:100%;padding:14px 24px;border-radius:var(--r-lg);font-size:14px;font-weight:700;background:rgba(37,211,102,.1);color:#25D366;border:1px solid rgba(37,211,102,.22);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;transition:background var(--transition),border-color var(--transition),transform var(--transition)}
.btn-whatsapp:hover{background:rgba(37,211,102,.18);border-color:rgba(37,211,102,.4);transform:scale(1.01)}

/* ── TRUST ────────────────────────────────────────────────────── */
.trust-row{display:flex;gap:8px;margin:18px 0}
.trust-item{flex:1;padding:10px 8px;border-radius:var(--r-sm);border:1px solid var(--c-border);background:var(--c-surface);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.trust-icon{font-size:18px}
.trust-label{font-size:10px;font-weight:600;color:var(--c-text-muted);line-height:1.3}

/* ── TESTIMONIOS ──────────────────────────────────────────────── */
.testimonials-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.testimonials-scroll::-webkit-scrollbar{display:none}
.testi-card{min-width:280px;padding:18px;border-radius:var(--r-lg);background:var(--c-surface);border:1px solid var(--c-border);scroll-snap-align:start;transition:border-color var(--transition),transform var(--transition)}
.testi-card:hover{border-color:var(--c-border-h);transform:translateY(-2px)}
.testi-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.testi-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.av-red{background:rgba(232,39,42,.2);color:#FF7070;border:1px solid rgba(232,39,42,.3)}
.av-wine{background:rgba(139,0,0,.25);color:#FF8080;border:1px solid rgba(139,0,0,.4)}
.av-rose{background:rgba(220,80,80,.2);color:#FFAAAA;border:1px solid rgba(220,80,80,.3)}
.av-amber{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.testi-name{font-size:14px;font-weight:700}
.testi-handle{font-size:11px;color:var(--c-text-dim)}
.testi-stars{color:var(--c-gold);font-size:12px;margin-bottom:8px}
.testi-quote{font-size:13px;color:var(--c-text-muted);line-height:1.6;font-style:italic}

/* ── FAQ ──────────────────────────────────────────────────────── */
.faq-list{display:flex;flex-direction:column;gap:8px}
.faq-item{border-radius:var(--r-md);border:1px solid var(--c-border);background:var(--c-surface);overflow:hidden;transition:border-color var(--transition)}
.faq-item.open{border-color:var(--c-border-h)}
.faq-q{width:100%;padding:16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;text-align:left;background:none;color:var(--c-text);transition:color var(--transition)}
.faq-q:hover{color:var(--c-accent-light)}
.faq-chevron{width:20px;height:20px;border-radius:50%;background:var(--c-surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:transform var(--transition),background var(--transition)}
.faq-item.open .faq-chevron{transform:rotate(180deg);background:var(--c-accent-dim)}
.faq-a{max-height:0;overflow:hidden;font-size:13px;color:var(--c-text-muted);line-height:1.65;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.faq-item.open .faq-a{max-height:200px}
.faq-a-inner{padding:0 16px 16px}

/* ── BUNDLE ───────────────────────────────────────────────────── */
.bundle-card{border-radius:var(--r-xl);padding:28px 24px;background:linear-gradient(135deg,rgba(232,39,42,.1) 0%,rgba(139,0,0,.08) 100%);border:1px solid rgba(232,39,42,.22);text-align:center}
.bundle-title{font-size:22px;font-weight:800;margin-bottom:8px}
.bundle-desc{font-size:14px;color:var(--c-text-muted);margin-bottom:20px;line-height:1.6}
.btn-bundle{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:var(--r-pill);background:var(--c-surface);border:1.5px solid var(--c-accent);color:var(--c-accent-light);font-size:14px;font-weight:700;transition:background var(--transition),transform var(--transition)}
.btn-bundle:hover{background:var(--c-accent-dim);transform:scale(1.03)}

/* ── STICKY CTA ───────────────────────────────────────────────── */
.sticky-cta{position:fixed;bottom:0;left:0;right:0;z-index:90;padding:12px 20px 20px;background:rgba(13,5,5,.94);backdrop-filter:blur(18px);border-top:1px solid var(--c-border);transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.sticky-cta.visible{transform:translateY(0)}
.sticky-cta-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky-price{flex-shrink:0}
.sticky-price-main{font-size:18px;font-weight:800;color:var(--c-accent)}
.sticky-price-full{font-size:12px;color:var(--c-text-dim);text-decoration:line-through}
.sticky-btn{flex:1;padding:13px 20px;border-radius:var(--r-lg);font-size:14px;font-weight:800;background:var(--c-accent);color:#fff;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--transition),box-shadow var(--transition);box-shadow:0 0 24px var(--c-accent-glow)}
.sticky-btn:hover{transform:scale(1.02);box-shadow:0 0 40px var(--c-accent-glow)}

/* ── FOOTER ───────────────────────────────────────────────────── */
.footer{padding:40px 20px 100px;text-align:center;border-top:1px solid var(--c-border)}
.footer-logo{font-size:14px;font-weight:800;letter-spacing:.1em;color:var(--c-text-muted);margin-bottom:6px}
.footer-sub{font-size:12px;color:var(--c-text-dim)}
.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 0;font-size:11px;color:var(--c-text-dim);letter-spacing:.06em;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.mt-12{margin-top:12px}.text-muted{color:var(--c-text-muted);font-size:13px}
@media(min-width:600px){body{font-size:17px}.hero h1{font-size:30px}.price-now{font-size:36px}}
</style>

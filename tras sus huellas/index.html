<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @keyframes scan {
        0% { top: 0%; }
        50% { top: 100%; }
        100% { top: 0%; }
      }
      .animate-in { animation: fadeIn 0.5s ease-out; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
      import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
      import { Camera, MapPin, Search, AlertCircle, CheckCircle, ArrowLeft, Loader2, Info, Phone, PawPrint } from 'https://esm.sh/lucide-react@0.292.0';

      const INITIAL_CASES = [
        {
          id: '1',
          type: 'perdido',
          animalType: 'Perro',
          photo: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80',
          location: 'Parque Central, Zona 4',
          color: 'Marrón/Blanco',
          size: 'Mediano',
          coat: 'Corto',
          contact: '555-0192',
          date: new Date(Date.now() - 86400000).toLocaleDateString()
        },
        {
          id: '2',
          type: 'encontrado',
          animalType: 'Gato',
          photo: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80',
          location: 'Avenida Siempreviva 742',
          color: 'Naranja/Blanco',
          size: 'Pequeño',
          coat: 'Corto',
          contact: '555-0987',
          date: new Date().toLocaleDateString()
        }
      ];

      function App() {
        const [view, setView] = useState('dashboard');
        const [cases, setCases] = useState(INITIAL_CASES);
        const [isScanning, setIsScanning] = useState(false);
        const [scanMessage, setScanMessage] = useState('');

        const [formData, setFormData] = useState({
          photo: null,
          animalType: 'Perro',
          location: '',
          color: '',
          size: '',
          coat: '',
          contact: ''
        });
        const [previewUrl, setPreviewUrl] = useState(null);
        const fileInputRef = useRef(null);

        const handleNavigate = (newView) => {
          setView(newView);
          setFormData({ photo: null, animalType: 'Perro', location: '', color: '', size: '', coat: '', contact: '' });
          setPreviewUrl(null);
        };

        const handleImageChange = (e) => {
          const file = e.target.files[0];
          if (file) {
            setFormData({ ...formData, photo: file });
            const reader = new FileReader();
            reader.onloadend = () => setPreviewUrl(reader.result);
            reader.readAsDataURL(file);
          }
        };

        const simulateVisionAI = async () => {
          setIsScanning(true);
          const messages = [
            "Iniciando escaneo biométrico...",
            "Analizando patrones de pelaje...",
            "Extrayendo marcadores de color y tamaño...",
            "Cruzando datos con base de casos...",
            "Generando reporte de IA..."
          ];

          for (let i = 0; i < messages.length; i++) {
            setScanMessage(messages[i]);
            await new Promise(resolve => setTimeout(resolve, 800));
          }

          const newCase = {
            id: Math.random().toString(36).substring(7),
            type: view === 'reportLost' ? 'perdido' : 'encontrado',
            animalType: formData.animalType,
            photo: previewUrl || 'https://images.unsplash.com/photo-1537151608804-ea6f1f31f919?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80',
            location: formData.location || 'Ubicación no especificada',
            color: formData.color,
            size: formData.size,
            coat: formData.coat,
            contact: formData.contact || 'Sin contacto',
            date: new Date().toLocaleDateString()
          };

          setCases([newCase, ...cases]);
          setIsScanning(false);
          handleNavigate('dashboard');
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!previewUrl) {
            alert("Por favor, sube una foto de la mascota para que la IA pueda analizarla.");
            return;
          }
          simulateVisionAI();
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-rose-50 font-sans text-stone-800 selection:bg-amber-200">
            <header className="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10 border-b border-amber-100">
              <div className="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <div 
                  className="flex items-center gap-3 cursor-pointer" 
                  onClick={() => handleNavigate('dashboard')}
                >
                  <div className="bg-gradient-to-br from-amber-400 to-orange-500 p-2.5 rounded-2xl text-white shadow-lg shadow-orange-500/30">
                    <PawPrint size={26} strokeWidth={2.5} />
                  </div>
                  <h1 className="text-2xl font-black bg-gradient-to-r from-amber-600 to-orange-600 bg-clip-text text-transparent tracking-tight">
                    Tras Sus Huellas
                  </h1>
                </div>
              </div>
            </header>

            <main className="max-w-md mx-auto p-4 pb-20">
              {view === 'dashboard' && (
                <div className="animate-in">
                  <section className="mb-8 mt-2">
                    <h2 className="text-xl font-bold mb-4 text-stone-700">¿Qué necesitas hacer hoy?</h2>
                    <div className="grid grid-cols-2 gap-4">
                      <button 
                        onClick={() => handleNavigate('reportFound')}
                        className="flex flex-col items-center justify-center gap-3 p-6 bg-white hover:bg-emerald-50 border-2 border-emerald-100 rounded-[2rem] transition-all text-emerald-600 shadow-md hover:shadow-xl hover:border-emerald-300 active:scale-95"
                      >
                        <div className="bg-emerald-100 p-3 rounded-full">
                          <CheckCircle size={28} />
                        </div>
                        <span className="font-bold text-center leading-tight">Encontré<br/>una mascota</span>
                      </button>
                      <button 
                        onClick={() => handleNavigate('reportLost')}
                        className="flex flex-col items-center justify-center gap-3 p-6 bg-white hover:bg-orange-50 border-2 border-orange-100 rounded-[2rem] transition-all text-orange-600 shadow-md hover:shadow-xl hover:border-orange-300 active:scale-95"
                      >
                        <div className="bg-orange-100 p-3 rounded-full">
                          <AlertCircle size={28} />
                        </div>
                        <span className="font-bold text-center leading-tight">Perdí a<br/>mi mascota</span>
                      </button>
                    </div>
                  </section>

                  <section>
                    <div className="flex items-center justify-between mb-5">
                      <h2 className="text-xl font-bold text-stone-700">Casos Activos</h2>
                      <span className="bg-white px-3 py-1 rounded-full text-sm font-bold text-orange-500 shadow-sm border border-orange-100">
                        {cases.length} reportes
                      </span>
                    </div>
                    <div className="grid grid-cols-1 gap-6">
                      {cases.map((c) => (
                        <div key={c.id} className="bg-white rounded-[2rem] overflow-hidden shadow-lg shadow-stone-200/50 border border-stone-100 hover:shadow-xl transition-shadow">
                          <div className="relative h-56 w-full bg-stone-200">
                            <img src={c.photo} alt="Mascota" className="w-full h-full object-cover" />
                            <div className="absolute top-4 left-4">
                              {c.type === 'perdido' ? (
                                <span className="bg-orange-500/90 backdrop-blur-md text-white px-4 py-2 rounded-2xl text-sm font-bold flex items-center gap-2 shadow-lg">
                                  <AlertCircle size={18} /> Perdido
                                </span>
                              ) : (
                                <span className="bg-emerald-500/90 backdrop-blur-md text-white px-4 py-2 rounded-2xl text-sm font-bold flex items-center gap-2 shadow-lg">
                                  <CheckCircle size={18} /> Encontrado
                                </span>
                              )}
                            </div>
                            <div className="absolute bottom-4 right-4 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-xl text-xs font-bold text-stone-600 shadow-lg">
                              {c.date}
                            </div>
                            <div className="absolute bottom-4 left-4 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-xl text-xs font-bold text-stone-600 shadow-lg flex items-center gap-1">
                              <PawPrint size={14} className="text-amber-500" /> {c.animalType}
                            </div>
                          </div>
                          <div className="p-5">
                            <div className="flex items-start gap-2 text-stone-600 mb-3">
                              <MapPin size={20} className="shrink-0 mt-0.5 text-orange-400" />
                              <span className="font-bold text-stone-700 leading-tight">{c.location}</span>
                            </div>
                            <div className="flex flex-wrap gap-2 mb-4">
                              {c.color && <span className="bg-amber-50 text-amber-700 border border-amber-100 text-xs px-3 py-1.5 rounded-xl font-bold">{c.color}</span>}
                              {c.size && <span className="bg-stone-50 text-stone-600 border border-stone-100 text-xs px-3 py-1.5 rounded-xl font-bold">{c.size}</span>}
                              {c.coat && <span className="bg-stone-50 text-stone-600 border border-stone-100 text-xs px-3 py-1.5 rounded-xl font-bold">{c.coat}</span>}
                            </div>
                            <div className="pt-4 border-t border-stone-100 flex items-center justify-between">
                              <span className="text-sm font-bold text-stone-500 flex items-center gap-2 bg-stone-50 px-3 py-1.5 rounded-xl">
                                <Phone size={16} className="text-stone-400" /> {c.contact}
                              </span>
                              <button className="text-orange-600 text-sm font-black hover:text-orange-700 uppercase tracking-wide">Ver más</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                </div>
              )}

              {(view === 'reportLost' || view === 'reportFound') && (
                <div className="animate-in">
                  <button 
                    onClick={() => handleNavigate('dashboard')}
                    className="flex items-center gap-2 text-stone-500 mb-6 font-bold hover:text-stone-800 bg-white px-4 py-2 rounded-full shadow-sm border border-stone-100 w-fit"
                  >
                    <ArrowLeft size={20} /> Volver
                  </button>

                  <div className="mb-6 bg-white p-6 rounded-[2rem] shadow-sm border border-stone-100">
                    <h2 className="text-2xl font-black text-stone-800 mb-2">
                      {view === 'reportLost' ? 'Reportar mascota perdida' : 'Reportar mascota encontrada'}
                    </h2>
                    <p className="text-stone-500 font-medium text-sm">
                      Sube una foto clara. Nuestra IA extraerá automáticamente algunos rasgos, pero puedes ajustarlos.
                    </p>
                  </div>

                  <form onSubmit={handleSubmit} className="space-y-6">
                    <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-stone-100 space-y-2">
                      <label className="block text-sm font-black text-stone-700">Foto de la mascota *</label>
                      <div 
                        onClick={() => fileInputRef.current?.click()}
                        className={`relative w-full h-64 rounded-3xl border-2 border-dashed flex flex-col items-center justify-center cursor-pointer overflow-hidden transition-all ${
                          previewUrl ? 'border-amber-400' : 'border-stone-200 hover:border-amber-400 bg-stone-50'
                        }`}
                      >
                        {previewUrl ? (
                          <>
                            <img src={previewUrl} alt="Preview" className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity backdrop-blur-sm">
                              <span className="text-white font-bold flex items-center gap-2 bg-black/50 px-4 py-2 rounded-full">
                                <Camera size={20} /> Cambiar foto
                              </span>
                            </div>
                          </>
                        ) : (
                          <div className="text-center p-4">
                            <div className="bg-white p-4 rounded-full shadow-sm inline-block mb-3">
                              <Camera size={40} className="text-amber-400" />
                            </div>
                            <span className="block text-stone-600 font-bold mb-1">Toca para subir una foto</span>
                            <p className="text-xs text-stone-400 font-medium">Formatos: JPG, PNG</p>
                          </div>
                        )}
                        <input 
                          type="file" 
                          ref={fileInputRef} 
                          onChange={handleImageChange} 
                          accept="image/*" 
                          className="hidden" 
                        />
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-stone-100 space-y-5">
                      <div className="space-y-2">
                        <label className="block text-sm font-black text-stone-700">Ubicación *</label>
                        <div className="relative">
                          <MapPin size={22} className="absolute left-4 top-3.5 text-stone-400" />
                          <input 
                            type="text" 
                            required
                            placeholder="¿Dónde fue visto/perdido?"
                            value={formData.location}
                            onChange={(e) => setFormData({...formData, location: e.target.value})}
                            className="w-full pl-12 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all font-medium text-stone-700"
                          />
                        </div>
                      </div>

                      <div className="space-y-2">
                        <label className="block text-sm font-black text-stone-700">Tipo de mascota *</label>
                        <select 
                          value={formData.animalType}
                          onChange={(e) => setFormData({...formData, animalType: e.target.value})}
                          className="w-full px-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all font-medium text-stone-700"
                        >
                          <option value="Perro">Perro</option>
                          <option value="Gato">Gato</option>
                          <option value="Otro">Otro</option>
                        </select>
                      </div>

                      <div className="pt-4 border-t border-stone-100">
                        <div className="flex items-center gap-2 text-sm font-black text-stone-700 mb-3">
                          <Info size={18} className="text-amber-500"/> Rasgos (Opcional, ayuda a la IA)
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                          <div className="space-y-1.5">
                            <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Color</label>
                            <select 
                              value={formData.color}
                              onChange={(e) => setFormData({...formData, color: e.target.value})}
                              className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none font-medium"
                            >
                              <option value="">Seleccionar...</option>
                              <option value="Negro">Negro</option>
                              <option value="Blanco">Blanco</option>
                              <option value="Marrón">Marrón / Café</option>
                              <option value="Dorado">Dorado</option>
                              <option value="Gris">Gris</option>
                              <option value="Naranja">Naranja</option>
                              <option value="Manchado">Manchado / Mixto</option>
                            </select>
                          </div>
                          <div className="space-y-1.5">
                            <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Tamaño</label>
                            <select 
                              value={formData.size}
                              onChange={(e) => setFormData({...formData, size: e.target.value})}
                              className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none font-medium"
                            >
                              <option value="">Seleccionar...</option>
                              <option value="Pequeño">Pequeño</option>
                              <option value="Mediano">Mediano</option>
                              <option value="Grande">Grande</option>
                            </select>
                          </div>
                          <div className="space-y-1.5 col-span-2">
                            <label className="text-xs font-bold text-stone-500 uppercase tracking-wide">Pelaje</label>
                            <select 
                              value={formData.coat}
                              onChange={(e) => setFormData({...formData, coat: e.target.value})}
                              className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 outline-none font-medium"
                            >
                              <option value="">Seleccionar...</option>
                              <option value="Corto">Corto</option>
                              <option value="Largo">Largo</option>
                              <option value="Rizado">Rizado</option>
                              <option value="Sin pelo">Sin pelo</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-stone-100 space-y-2">
                      <label className="block text-sm font-black text-stone-700">Teléfono de Contacto *</label>
                      <div className="relative">
                        <Phone size={22} className="absolute left-4 top-3.5 text-stone-400" />
                        <input 
                          type="tel" 
                          required
                          placeholder="Ej. 555-123-4567"
                          value={formData.contact}
                          onChange={(e) => setFormData({...formData, contact: e.target.value})}
                          className="w-full pl-12 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all font-medium text-stone-700"
                        />
                      </div>
                    </div>

                    <button 
                      type="submit"
                      className={`w-full py-4 rounded-2xl font-black text-lg text-white shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 ${
                        view === 'reportLost' 
                          ? 'bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 shadow-orange-500/30' 
                          : 'bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 shadow-emerald-500/30'
                      }`}
                    >
                      <Search size={24} strokeWidth={2.5} />
                      Procesar con Vision AI
                    </button>
                  </form>
                </div>
              )}
            </main>

            {isScanning && (
              <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white p-8 rounded-[2.5rem] w-full max-w-sm flex flex-col items-center text-center shadow-2xl animate-in border border-stone-100">
                  <div className="relative mb-6">
                    <div className="absolute inset-0 bg-amber-500/20 rounded-full animate-ping"></div>
                    <div className="relative bg-gradient-to-br from-amber-400 to-orange-500 p-5 rounded-full text-white shadow-lg shadow-orange-500/30">
                      <Loader2 size={44} className="animate-spin" />
                    </div>
                  </div>
                  <h3 className="text-2xl font-black text-stone-800 mb-2">Tras Sus Huellas AI</h3>
                  <p className="text-orange-600 font-bold h-6 animate-pulse">
                    {scanMessage}
                  </p>
                  
                  {previewUrl && (
                    <div className="mt-8 relative w-32 h-32 rounded-3xl overflow-hidden border-4 border-stone-100 mx-auto shadow-inner">
                      <img src={previewUrl} alt="Scanning" className="w-full h-full object-cover opacity-60 grayscale" />
                      <div className="absolute top-0 left-0 right-0 h-1.5 bg-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.9)] animate-[scan_2s_ease-in-out_infinite]"></div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>

<style>
  /* ==========================================================================
     SELLO VITALINK — ESTILOS PREMIUM v2.3
     Capa 40_View | Inline para PageSpeed 100
     ==========================================================================
     - Tokens basados en DESIGN_TOKENS de Config.gs
     - Glassmorphism, micro-interacciones, animaciones 60fps
     - Respetando prefers-reduced-motion
     ========================================================================== */

  /* --------------------------------------------------------------------------
     1. TOKENS (sincronizados con DESIGN_TOKENS del backend)
     -------------------------------------------------------------------------- */
  :root {
    /* Paleta Vitalink */
    --c-primary: #0056b3;
    --c-primary-dark: #003d80;
    --c-primary-darker: #002855;
    --c-primary-light: #e8f1fb;
    --c-primary-glow: rgba(0, 86, 179, 0.35);

    --c-white: #FFFFFF;
    --c-ink: #0a0a0a;
    --c-ink-soft: #1f2937;
    --c-muted: #6b7280;
    --c-muted-light: #9ca3af;
    --c-surface: #f8fafc;

    --c-success: #16a34a;
    --c-danger: #dc2626;
    --c-danger-dark: #b91c1c;
    --c-danger-glow: rgba(220, 38, 38, 0.4);
    --c-whatsapp: #25D366;
    --c-whatsapp-dark: #1fb855;
    --c-whatsapp-glow: rgba(37, 211, 102, 0.35);
    --c-border: #e5e7eb;

    /* Radios */
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --r-xl: 22px;
    --r-2xl: 28px;
    --r-pill: 999px;

    /* Sombras con profundidad real */
    --sh-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --sh-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
    --sh-md: 0 6px 16px rgba(0, 86, 179, 0.12), 0 2px 4px rgba(0, 86, 179, 0.08);
    --sh-lg: 0 16px 40px rgba(0, 86, 179, 0.18), 0 4px 8px rgba(0, 86, 179, 0.10);
    --sh-xl: 0 24px 60px rgba(0, 86, 179, 0.22), 0 8px 16px rgba(0, 86, 179, 0.12);

    /* Sombras de emergencia (rojo) */
    --sh-emergency: 0 20px 50px rgba(220, 38, 38, 0.35), 0 8px 16px rgba(220, 38, 38, 0.20), inset 0 1px 0 rgba(255,255,255,0.15);
    --sh-emergency-hover: 0 28px 64px rgba(220, 38, 38, 0.45), 0 12px 20px rgba(220, 38, 38, 0.25), inset 0 1px 0 rgba(255,255,255,0.20);

    /* Gradientes */
    --g-primary: linear-gradient(135deg, #0056b3 0%, #003d80 100%);
    --g-primary-hover: linear-gradient(135deg, #0066d1 0%, #004494 100%);
    --g-emergency: linear-gradient(135deg, #ef4444 0%, #b91c1c 55%, #991b1b 100%);
    --g-emergency-hover: linear-gradient(135deg, #f87171 0%, #dc2626 55%, #b91c1c 100%);
    --g-whatsapp: linear-gradient(135deg, #25D366 0%, #1fb855 100%);
    --g-page-bg: radial-gradient(ellipse at top, #f0f7ff 0%, #ffffff 55%);

    /* Tipografía */
    --f-base: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    /* Transiciones */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* --------------------------------------------------------------------------
     2. RESET + BASE
     -------------------------------------------------------------------------- */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    font-family: var(--f-base);
    color: var(--c-ink);
    background: var(--g-page-bg);
    background-attachment: fixed;
    line-height: 1.5;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    min-height: 100svh;
    position: relative;
    overflow-x: hidden;
  }

  /* Orbes de fondo decorativos */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.45;
    z-index: 0;
    pointer-events: none;
    will-change: transform;
  }

  body::before {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
    top: -200px; right: -180px;
    animation: orbFloat1 18s ease-in-out infinite;
  }

  body::after {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
    bottom: -180px; left: -140px;
    animation: orbFloat2 22s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-40px, 30px) scale(1.08); }
    66% { transform: translate(25px, 60px) scale(0.94); }
  }

  @keyframes orbFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, -40px) scale(1.12); }
  }

  /* --------------------------------------------------------------------------
     3. LAYOUT
     -------------------------------------------------------------------------- */
  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    min-height: 100vh;
    min-height: 100svh;
  }

  /* --------------------------------------------------------------------------
     4. HERO
     -------------------------------------------------------------------------- */
  .hero {
    text-align: center;
    padding: 24px 16px 12px;
    animation: fadeInDown 0.6s var(--ease-out) both;
  }

  /* Badge 24/7 con pulso de ondas reales */
  .hero__badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--c-primary-dark);
    padding: 8px 18px 8px 14px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 20px;
    box-shadow: var(--sh-sm), inset 0 0 0 1px rgba(0, 86, 179, 0.08);
  }

  .pulse-dot {
    position: relative;
    width: 10px;
    height: 10px;
    background: var(--c-success);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6);
  }

  .pulse-dot::before,
  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--c-success);
    animation: pulseRing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
  }

  .pulse-dot::after {
    animation-delay: 1.1s;
  }

  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(3); opacity: 0; }
  }

  .hero__title {
    font-size: clamp(32px, 8vw, 42px);
    font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--c-ink);
    margin-bottom: 8px;
    line-height: 1.05;
  }

  .hero__title span {
    background: var(--g-primary);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }

  .hero__subtitle {
    font-size: 15px;
    color: var(--c-ink-soft);
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: -0.005em;
  }

  .hero__trust {
    font-size: 12.5px;
    color: var(--c-muted);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* --------------------------------------------------------------------------
     5. BOTONES — BASE
     -------------------------------------------------------------------------- */
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px 20px;
    border: none;
    border-radius: var(--r-xl);
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
    position: relative;
    overflow: hidden;
    transition:
      transform 0.18s var(--ease-spring),
      box-shadow 0.25s var(--ease-out),
      background 0.2s var(--ease-out);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    isolation: isolate;
  }

  .btn:focus-visible {
    outline: 3px solid rgba(0, 86, 179, 0.4);
    outline-offset: 3px;
  }

  /* Feedback táctil: se "hunde" ligeramente */
  .btn:active {
    transform: scale(0.97) translateY(1px);
    transition-duration: 0.05s;
  }

  /* Brillo interno que barre al hover */
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      110deg,
      transparent 30%,
      rgba(255, 255, 255, 0.18) 50%,
      transparent 70%
    );
    transform: translateX(-100%);
    transition: transform 0.7s var(--ease-out);
    pointer-events: none;
    z-index: 1;
  }

  .btn:hover::after {
    transform: translateX(100%);
  }

  .btn__icon {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-md);
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    position: relative;
    z-index: 2;
    transition: transform 0.3s var(--ease-spring);
  }

  .btn:hover .btn__icon {
    transform: scale(1.08) rotate(-3deg);
  }

  .btn__label {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 2;
  }

  .btn__label strong {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }

  .btn__label small {
    font-size: 13px;
    opacity: 0.88;
    font-weight: 500;
    letter-spacing: -0.005em;
  }

  /* Chevron indicador de acción */
  .btn__arrow {
    position: relative;
    z-index: 2;
    opacity: 0.55;
    transition: transform 0.3s var(--ease-out), opacity 0.2s ease;
  }

  .btn:hover .btn__arrow {
    transform: translateX(3px);
    opacity: 1;
  }

  /* --------------------------------------------------------------------------
     6. BOTÓN EMERGENCIA — EL REY DE LA PANTALLA
     -------------------------------------------------------------------------- */
  .btn--emergency {
    background: var(--g-emergency);
    color: var(--c-white);
    box-shadow: var(--sh-emergency);
    padding: 26px 22px;
    border-radius: var(--r-2xl);
    position: relative;
    animation: emergencyBreath 3.5s ease-in-out infinite;
  }

  /* Halo rojo pulsante detrás del botón */
  .btn--emergency::before {
    content: '';
    position: absolute;
    inset: -4px;
    background: var(--g-emergency);
    border-radius: inherit;
    filter: blur(18px);
    opacity: 0.55;
    z-index: -1;
    animation: emergencyHalo 2.8s ease-in-out infinite;
  }

  @keyframes emergencyBreath {
    0%, 100% { box-shadow: var(--sh-emergency); }
    50% { box-shadow: var(--sh-emergency-hover); }
  }

  @keyframes emergencyHalo {
    0%, 100% { opacity: 0.45; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.03); }
  }

  .btn--emergency:hover {
    background: var(--g-emergency-hover);
    transform: translateY(-2px);
    box-shadow: var(--sh-emergency-hover);
  }

  .btn--emergency .btn__icon {
    width: 58px;
    height: 58px;
    background: rgba(255, 255, 255, 0.25);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.15);
  }

  .btn--emergency .btn__label strong {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .btn--emergency .btn__label small {
    opacity: 0.95;
    font-weight: 500;
  }

  /* Icono cruz médica animada */
  .emergency-cross {
    animation: crossRotate 6s linear infinite;
  }

  @keyframes crossRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* --------------------------------------------------------------------------
     7. BOTÓN PRIMARIO (LLAMAR)
     -------------------------------------------------------------------------- */
  .btn--primary {
    background: var(--g-primary);
    color: var(--c-white);
    box-shadow: var(--sh-md);
  }

  .btn--primary:hover {
    background: var(--g-primary-hover);
    transform: translateY(-2px);
    box-shadow: var(--sh-lg);
  }

  /* --------------------------------------------------------------------------
     8. BOTÓN WHATSAPP
     -------------------------------------------------------------------------- */
  .btn--whatsapp {
    background: var(--g-whatsapp);
    color: var(--c-white);
    box-shadow: 0 10px 24px var(--c-whatsapp-glow), 0 3px 6px rgba(37, 211, 102, 0.18);
  }

  .btn--whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 32px var(--c-whatsapp-glow), 0 6px 10px rgba(37, 211, 102, 0.22);
  }

  /* --------------------------------------------------------------------------
     9. GEO STATUS
     -------------------------------------------------------------------------- */
  .emergency {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .geo-status {
    font-size: 13px;
    color: var(--c-muted);
    text-align: center;
    min-height: 18px;
    transition: color 0.2s ease;
    font-weight: 500;
  }

  .geo-status.is-success { color: var(--c-success); }
  .geo-status.is-warn { color: #d97706; }
  .geo-status.is-loading { color: var(--c-primary); }

  /* --------------------------------------------------------------------------
     10. ACCIONES (columna)
     -------------------------------------------------------------------------- */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeInUp 0.5s 0.1s var(--ease-out) both;
  }

  /* --------------------------------------------------------------------------
     11. CHIPS DE COBERTURA / SERVICIOS
     -------------------------------------------------------------------------- */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 18px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 86, 179, 0.08);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-xs);
  }

  .chips__label {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--c-primary-dark);
    margin-bottom: 4px;
  }

  .chips__label svg {
    color: var(--c-primary);
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    background: var(--c-white);
    color: var(--c-ink-soft);
    border: 1px solid var(--c-border);
    border-radius: var(--r-pill);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    transition: all 0.2s var(--ease-out);
  }

  .chip:hover {
    border-color: var(--c-primary);
    color: var(--c-primary);
    background: var(--c-primary-light);
    transform: translateY(-1px);
  }

  /* --------------------------------------------------------------------------
     12. INFO CARDS
     -------------------------------------------------------------------------- */
  .info {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .info__card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 86, 179, 0.08);
    border-radius: var(--r-lg);
    transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
  }

  .info__card:hover {
    transform: translateY(-2px);
    box-shadow: var(--sh-md);
  }

  .info__icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--g-primary);
    color: var(--c-white);
    border-radius: var(--r-md);
    box-shadow: 0 4px 10px rgba(0, 86, 179, 0.25);
  }

  .info__card strong {
    display: block;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--c-ink);
    margin-bottom: 3px;
    letter-spacing: -0.01em;
  }

  .info__card p {
    font-size: 13px;
    color: var(--c-muted);
    line-height: 1.5;
  }

  /* --------------------------------------------------------------------------
     13. SOCIAL
     -------------------------------------------------------------------------- */
  .social {
    text-align: center;
    padding: 8px 0;
  }

  .social__label {
    font-size: 12px;
    color: var(--c-muted);
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .social__row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .social__btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid var(--c-border);
    color: var(--c-ink-soft);
    border-radius: var(--r-pill);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.22s var(--ease-out);
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  .social__btn:hover {
    border-color: var(--c-primary);
    color: var(--c-primary);
    transform: translateY(-2px);
    box-shadow: var(--sh-md);
  }

  .social__btn:active {
    transform: scale(0.95);
  }

  /* --------------------------------------------------------------------------
     14. FOOTER
     -------------------------------------------------------------------------- */
  .foot {
    text-align: center;
    padding-top: 16px;
    margin-top: auto;
    border-top: 1px solid rgba(0, 86, 179, 0.08);
  }

  .foot p {
    font-size: 12px;
    color: var(--c-muted);
    font-weight: 500;
  }

  /* --------------------------------------------------------------------------
     15. ANIMACIONES DE ENTRADA
     -------------------------------------------------------------------------- */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --------------------------------------------------------------------------
     16. RESPONSIVE
     -------------------------------------------------------------------------- */
  @media (min-width: 520px) {
    .app { padding: 36px 24px 48px; gap: 26px; }
    .hero { padding: 44px 16px 12px; }
    .hero__title { font-size: 44px; }
  }

  /* --------------------------------------------------------------------------
     17. ACCESIBILIDAD — Reduce motion
     -------------------------------------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    body::before, body::after { display: none; }
    .pulse-dot::before, .pulse-dot::after { display: none; }
  }
</style>
